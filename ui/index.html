<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'">
<title>DevPilot</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="shell">
  <aside class="side">
    <div class="brand drag"><div class="logo"><svg viewBox="0 0 24 24"><path d="M5 17 L12 4 L19 17 L12 13.5 Z" fill="currentColor"/><circle cx="12" cy="19.5" r="1.6" fill="currentColor"/></svg></div><b>DevPilot</b></div>
    <div class="side-search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="sideQ" placeholder="Search projects…" spellcheck="false"></div>
    <nav id="projList" class="proj-list"></nav>
    <div class="side-foot">
      <button class="side-btn primary" id="btnAdd"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add project</button>
      <button class="side-btn" id="btnFind"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Find my projects</button>
      <div class="side-nav">
        <button class="nav-item" data-page="ports"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="6" rx="2"/><rect x="3" y="14" width="18" height="6" rx="2"/><path d="M7 7h.01M7 17h.01"/></svg>Ports</button>
        <button class="nav-item" data-page="settings"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
      </div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar drag"><div id="crumb" class="crumb"></div></header>
    <section id="view" class="view"></section>
  </main>
</div>
<div id="toasts" class="toasts"></div>
<div id="modals"></div>
<script src="app.js"></script>
</body>
</html>
